version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: algo_trader_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: algo_trader
      MYSQL_USER: trader
      MYSQL_PASSWORD: trader_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  app:
    build: .
    container_name: algo_trader_app
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./app:/app/app
      - ./static:/app/static
      - ./templates:/app/templates

volumes:
  mysql_data:
